<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KothaCraft AI Studio</title>
    <link rel="stylesheet" href="/ui.css" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--ink);
        font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .master-shell {
        display: flex;
        flex-direction: column;
        height: 100vh;
        width: 100vw;
      }
      .master-header {
        height: 56px;
        min-height: 56px;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        padding: 0 16px;
        gap: 16px;
        z-index: 100;
        user-select: none;
      }
      .brand-title {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 700;
        font-size: 15px;
        letter-spacing: -0.2px;
        color: #fff;
        text-decoration: none;
        white-space: nowrap;
      }
      .brand-title span.badge-pro {
        font-size: 10px;
        background: linear-gradient(135deg, #6ea8fe 0%, #a371f7 100%);
        color: #000;
        font-weight: 800;
        padding: 2px 6px;
        border-radius: 4px;
        text-transform: uppercase;
      }
      .studio-nav {
        display: flex;
        align-items: center;
        gap: 4px;
        background: var(--panel-2);
        padding: 4px;
        border-radius: 8px;
        border: 1px solid var(--line);
      }
      .studio-tab-btn {
        background: transparent;
        border: none;
        color: var(--dim);
        padding: 6px 13px;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
        transition: all 0.15s ease;
        white-space: nowrap;
      }
      .studio-tab-btn:hover {
        color: var(--ink);
        background: rgba(255, 255, 255, 0.04);
      }
      .studio-tab-btn.active {
        background: rgba(110, 168, 254, 0.15);
        color: var(--accent);
        font-weight: 600;
      }
      .studio-tab-btn .tab-badge {
        font-size: 9px;
        background: var(--ok);
        color: #000;
        font-weight: 700;
        padding: 1px 5px;
        border-radius: 10px;
        display: none;
      }
      .header-right {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .status-pill {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        padding: 4px 10px;
        border-radius: 999px;
        background: var(--panel-2);
        border: 1px solid var(--line);
        color: var(--dim);
      }
      .status-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--ok);
      }
      .status-dot.busy {
        background: var(--warn);
        box-shadow: 0 0 8px var(--warn);
        animation: pulse 1.2s infinite;
      }
      @keyframes pulse {
        0% { opacity: 0.6; }
        50% { opacity: 1; }
        100% { opacity: 0.6; }
      }
      .views-container {
        flex: 1;
        position: relative;
        width: 100%;
        height: calc(100vh - 56px);
        background: var(--bg);
      }
      .studio-frame {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border: none;
        display: none;
        background: var(--bg);
      }
      .studio-frame.active {
        display: block;
      }
      /* Master Toast */
      .master-toast {
        position: fixed;
        bottom: 24px;
        right: 24px;
        background: var(--panel-2);
        border: 1px solid var(--accent);
        color: var(--ink);
        padding: 12px 18px;
        border-radius: 8px;
        font-size: 13px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        display: flex;
        align-items: center;
        gap: 10px;
        z-index: 1000;
        transform: translateY(100px);
        opacity: 0;
        transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        pointer-events: none;
      }
      .master-toast.show {
        transform: translateY(0);
        opacity: 1;
      }
      @media (max-width: 900px) {
        .brand-title span.brand-text { display: none; }
        .studio-tab-btn { padding: 6px 8px; font-size: 12px; }
      }
    </style>
  </head>
  <body>
    <div class="master-shell">
      <!-- Top Unified Navigation Header -->
      <header class="master-header">
        <a href="/" class="brand-title">
          <span style="font-size: 18px;">⚡</span>
          <span class="brand-text">KothaCraft</span>
          <span class="badge-pro">Studio</span>
        </a>

        <!-- Master Studio Mode Tabs -->
        <nav class="studio-nav" id="studioNav">
          <button class="studio-tab-btn active" data-tab="video">
            <span>🎥 AI Video</span>
            <span class="tab-badge" id="badgeVideo">New</span>
          </button>
          <button class="studio-tab-btn" data-tab="reels">
            <span>🎬 Story Reels</span>
          </button>
          <button class="studio-tab-btn" data-tab="dialogue">
            <span>💬 Dialogue</span>
          </button>
          <button class="studio-tab-btn" data-tab="verses">
            <span>📖 Verse Reels</span>
          </button>
          <button class="studio-tab-btn" data-tab="cards">
            <span>🎴 Photo Cards</span>
          </button>
          <button class="studio-tab-btn" data-tab="stock">
            <span>📁 Stock Library</span>
          </button>
        </nav>

        <!-- System Capabilities & Status -->
        <div class="header-right">
          <div class="status-pill" id="capsPill">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">LTX-2.3 Q8 • Apple Silicon</span>
          </div>
          <button id="masterCancelBtn" class="btn-sec danger" style="padding: 4px 10px; font-size: 11px; display: none;">
            Cancel Job
          </button>
        </div>
      </header>

      <!-- Unified Viewport Hosting Persistent Studio Frames -->
      <div class="views-container">
        <iframe id="view-video" class="studio-frame active" src="/video.html" title="AI Video Studio"></iframe>
        <iframe id="view-reels" class="studio-frame" src="/reels.html" title="Story Reels Studio"></iframe>
        <iframe id="view-dialogue" class="studio-frame" src="/dialogue.html" title="Dialogue Studio"></iframe>
        <iframe id="view-verses" class="studio-frame" src="/verses.html" title="Verse Reels Studio"></iframe>
        <iframe id="view-cards" class="studio-frame" src="/cards.html" title="Photo Cards Studio"></iframe>
        <iframe id="view-stock" class="studio-frame" src="/reels.html?stock=1" title="Stock Library"></iframe>
      </div>
    </div>

    <!-- Master Toast Notification -->
    <div id="masterToast" class="master-toast">
      <span id="toastIcon">✨</span>
      <span id="toastMsg">Ready</span>
    </div>

    <script>
      const tabs = {
        video: document.getElementById('view-video'),
        reels: document.getElementById('view-reels'),
        dialogue: document.getElementById('view-dialogue'),
        verses: document.getElementById('view-verses'),
        cards: document.getElementById('view-cards'),
        stock: document.getElementById('view-stock'),
      };

      const navButtons = document.querySelectorAll('#studioNav .studio-tab-btn');
      const statusDot = document.getElementById('statusDot');
      const statusText = document.getElementById('statusText');
      const masterCancelBtn = document.getElementById('masterCancelBtn');
      const masterToast = document.getElementById('masterToast');
      const toastMsg = document.getElementById('toastMsg');
      const toastIcon = document.getElementById('toastIcon');

      let currentTab = 'video';

      function showToast(message, icon = '✨') {
        toastMsg.textContent = message;
        toastIcon.textContent = icon;
        masterToast.classList.add('show');
        setTimeout(() => {
          masterToast.classList.remove('show');
        }, 3200);
      }

      function switchTab(tabKey, updateHash = true) {
        if (!tabs[tabKey]) tabKey = 'video';
        currentTab = tabKey;

        // Switch button states
        navButtons.forEach((btn) => {
          if (btn.dataset.tab === tabKey) {
            btn.classList.add('active');
          } else {
            btn.classList.remove('active');
          }
        });

        // Switch visible frame
        Object.keys(tabs).forEach((k) => {
          if (k === tabKey) {
            tabs[k].classList.add('active');
          } else {
            tabs[k].classList.remove('active');
          }
        });

        if (updateHash) {
          window.location.hash = `#${tabKey}`;
        }
      }

      // Tab button clicks
      navButtons.forEach((btn) => {
        btn.addEventListener('click', () => switchTab(btn.dataset.tab));
      });

      // Keyboard shortcuts: 1 (Video), 2 (Reels), 3 (Dialogue), 4 (Verses), 5 (Cards), 6 (Stock)
      window.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        if (e.key === '1') switchTab('video');
        if (e.key === '2') switchTab('reels');
        if (e.key === '3') switchTab('dialogue');
        if (e.key === '4') switchTab('verses');
        if (e.key === '5') switchTab('cards');
        if (e.key === '6') switchTab('stock');
      });

      // Handle Hash Changes
      function handleHash() {
        const hash = (window.location.hash || '').replace(/^#/, '');
        if (tabs[hash]) {
          switchTab(hash, false);
        } else {
          switchTab('video', false);
        }
      }
      window.addEventListener('hashchange', handleHash);
      handleHash();

      // Cancel button
      masterCancelBtn.addEventListener('click', async () => {
        if (confirm('Cancel current background job?')) {
          await fetch('/api/cancel', { method: 'POST' });
        }
      });

      // Cross-Frame PostMessage Listener
      window.addEventListener('message', (e) => {
        if (!e.data) return;
        if (e.data.type === 'switch-tab') {
          switchTab(e.data.tab);
          if (e.data.message) showToast(e.data.message);
        }
        if (e.data.type === 'toast') {
          showToast(e.data.message, e.data.icon || '✨');
        }
      });

      // Server-Sent Events (SSE) for System Status
      const es = new EventSource('/api/events');
      es.addEventListener('hello', (e) => {
        const d = JSON.parse(e.data);
        updateStatus(d.busy);
      });
      es.addEventListener('start', (e) => {
        const d = JSON.parse(e.data);
        updateStatus(true, d.label);
      });
      es.addEventListener('done', (e) => {
        const d = JSON.parse(e.data);
        updateStatus(false);
        if (d.ok) {
          showToast(`Completed: ${d.label || 'Job'}`, '✅');
        } else {
          showToast(`Failed: ${d.label || 'Job'}`, '❌');
        }
      });

      function updateStatus(busy, label = '') {
        if (busy) {
          statusDot.className = 'status-dot busy';
          statusText.textContent = label ? `Busy: ${label}` : 'Rendering in background...';
          masterCancelBtn.style.display = 'inline-block';
        } else {
          statusDot.className = 'status-dot';
          statusText.textContent = 'LTX-2.3 Q8 • Apple Silicon Metal';
          masterCancelBtn.style.display = 'none';
        }
      }

      // Initial state fetch
      fetch('/api/state')
        .then((r) => r.json())
        .then((s) => {
          updateStatus(s.busy, s.jobLabel);
        })
        .catch(() => {});
    </script>
  </body>
</html>
